<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up · Exercise Flow</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body class="login-page">
  <form class="login" method="post" action="/setup">
    <p class="login-brand">First-time setup</p>
    <h1>Choose the shared password</h1>
    <p class="login-help">
      Everyone who views or edits the board will use this one password.
      The <b>setup code</b> is printed in the window where the app was started.
    </p>
    <label for="code">Setup code</label>
    <input id="code" name="code" class="num" autocomplete="off" autofocus required placeholder="ABCDE-FGHJK">
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm">Type it again</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <p class="login-error" id="error" hidden></p>
    <button type="submit">Save and continue</button>
  </form>
  <script src="/js/setup.js"></script>
</body>
</html>
