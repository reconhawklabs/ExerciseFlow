name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Builds the single executable on each OS and checks it starts and serves the setup
  # page, so a broken build is caught here rather than at release time.
  exe:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:exe
      - name: Start it from an empty folder and fetch the setup page
        shell: bash
        run: |
          mkdir smoke && cp build/ExerciseFlow* smoke/ && cd smoke
          APP=$(ls ExerciseFlow*)
          PORT=8123 NO_BROWSER=1 "./$APP" > out.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8123/setup > page.html && break; sleep 1; done
          cat out.txt
          grep -qi "setup code" page.html
          test -f data/injects.json
