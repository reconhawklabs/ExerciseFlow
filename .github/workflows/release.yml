# Push a version tag (git tag v1.0.0 && git push origin v1.0.0) to build the Windows
# and Linux executables and attach them to a GitHub Release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.os }}
          path: build/ExerciseFlow*
          if-no-files-found: error

  # Only this job can write to the repo, and it runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: app-*
          merge-multiple: true
      - name: Attach the executables to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l ExerciseFlow*
          gh release create "$TAG" ExerciseFlow* --generate-notes \
            || gh release upload "$TAG" ExerciseFlow* --clobber
